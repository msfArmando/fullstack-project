[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "msfArmando",email = "armandomonsaof@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "python-settings (>=0.2.3,<0.3.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg (>=3.3.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "typos (>=1.51.1,<2.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=sql_alchemy_pratices', '--cov-context=test']

[tool.poe.tasks]
lint.sequence = [
  { cmd = "typos --write-changes" },
  { cmd = "ruff check" },
]
format.sequence = [
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]
test.sequence = [
  { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]
testreport = "poetry run coverage html --show-contexts"

[tool.poe]
poetry_command = ""

